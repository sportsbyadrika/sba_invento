---
# cPanel Git Version Control deployment
# Repository : /home/olympicd/repositories/sba_invento
# Destination: /home/olympicd/federaerp.com  (domain document root: .../federaerp.com/public)
#
# bin/deploy.sh copies the code but keeps everything the server owns:
# config/config.php, storage/, .well-known/ (SSL), php.ini / .user.ini, error_log
# and the cPanel "MultiPHP" handler block inside .htaccess.
deployment:
  tasks:
    - /bin/bash /home/olympicd/repositories/sba_invento/bin/deploy.sh /home/olympicd/repositories/sba_invento /home/olympicd/federaerp.com
